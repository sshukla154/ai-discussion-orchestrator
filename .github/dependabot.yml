version: 2
updates:
  # Two ecosystems today; npm joins once a frontend exists. Stale action versions are a real
  # supply-chain exposure and the one this repository would otherwise never notice.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
