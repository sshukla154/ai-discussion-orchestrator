name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          # Matches the development JDK exactly. No version matrix: the application runs
          # on one JDK on one machine, so a matrix would test configurations that never
          # exist while doubling the feedback loop.
          distribution: zulu
          java-version: '25'
          cache: maven

      # Retried separately from the build, because Maven Central returns the occasional
      # 502 and losing a run to someone else's bad gateway is pure noise. Retrying the
      # *build* instead would be worse: a genuine test failure would be re-run three
      # times before reporting, turning a fast red into a slow one. Warming the local
      # repository first keeps the retry where the flakiness actually is.
      - name: Resolve dependencies
        run: |
          for attempt in 1 2 3; do
            if mvn -B --no-transfer-progress dependency:go-offline; then exit 0; fi
            echo "resolution attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "dependency resolution still failing; continuing so the build reports the real error"

      # Hermetic by construction. Every test that touches the real Claude CLI is tagged
      # "live" and excluded here -- the CLI is not installed on a runner, and
      # authenticating it would mean putting a credential in repository secrets, which
      # this project does not do. See scripts/redaction-check.sh, which enforces that.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

  redaction:
    # Guards the leak class secret scanners do not cover: machine paths, personal
    # identifiers, and data files that must never be tracked in a public repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for machine-identifying or private content
        run: |
          chmod +x scripts/redaction-check.sh
          ./scripts/redaction-check.sh
