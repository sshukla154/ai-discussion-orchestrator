name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Required. The default shallow checkout scans a single commit, which makes the
          # whole job close to worthless: a secret introduced two commits ago is invisible.
          fetch-depth: 0

      # Free for repositories owned by a personal account, no licence key needed.
      # Pinned to v3 -- v2 reaches end of support during 2026.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
