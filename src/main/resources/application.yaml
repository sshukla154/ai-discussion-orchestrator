spring:
  application:
    name: ai-discussion-orchestrator
  main:
    web-application-type: none

aido:
  provenance:
    # Outside the repository, deliberately. Run records hold the exact prompts and responses of a
    # debate, and this repository is public. A placeholder rather than a literal path so no
    # machine-identifying string enters a tracked file.
    run-root: ${user.home}/.ai-discussion-orchestrator/runs

logging:
  level:
    # Prompts and responses carry private reasoning and are never logged above DEBUG.
    io.github.sshukla154.aido: INFO

# No datasource here on purpose. Phase one writes plain files, so the application boots without
# a database at all -- and the architecture test keeps main sources free of jakarta.persistence
# so that stays true rather than becoming a comment nobody rechecks.
#
# The persistence configuration proven by the spike lives in
# src/test/resources/application-persistence.yaml, and moves here when real entities arrive.
